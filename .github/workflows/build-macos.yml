name: Build macOS arm64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"
  EXPORT_NAME: "Bussin GriddyCode"

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -L -o Godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip Godot.zip
          mv "Godot.app" /Applications/
          ln -s /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot

      - name: Download Export Templates
        run: |
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable
          unzip templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable/

      - name: Setup macOS Export Preset
        run: python3 .github/workflows/setup_macos_preset.py

      - name: Debug - Print export_presets.cfg
        run: cat export_presets.cfg

      - name: Enable ETC2/ASTC for arm64
        run: |
          python3 -c "
          with open('project.godot', 'r') as f:
              content = f.read()
          if 'import_etc2_astc' not in content:
              if '[rendering]' in content:
                  content = content.replace(
                      '[rendering]',
                      '[rendering]\n\ntextures/vram_compression/import_etc2_astc=true'
                  )
              else:
                  content += '\n[rendering]\n\ntextures/vram_compression/import_etc2_astc=true\n'
              with open('project.godot', 'w') as f:
                  f.write(content)
              print('Added import_etc2_astc=true to project.godot')
          else:
              print('import_etc2_astc already present')
          "

      - name: Import Resources
        run: |
          godot --headless --editor --quit 2>/dev/null || true
          sleep 2

      - name: Export macOS arm64
        run: |
          mkdir -p Builds/macOS
          godot --headless --verbose --export-release "macOS" "Builds/macOS/GriddyCode.zip" 2>&1 || true
          if [ ! -f "Builds/macOS/GriddyCode.zip" ]; then
            echo "ERROR: Export failed - output file not found"
            exit 1
          fi
          echo "Export succeeded, output file exists."

      - name: Create DMG
        run: |
          mkdir -p dmg_source
          cd Builds/macOS
          unzip "GriddyCode.zip" -d ../../dmg_source/
          cd ../..
          hdiutil create -volname "GriddyCode" -srcfolder dmg_source -ov -format UDZO "Builds/macOS/GriddyCode-macOS-arm64.dmg"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: griddycode-macos-arm64
          path: Builds/macOS/GriddyCode-macOS-arm64.dmg

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -A1 "^${TAG}$" | tail -1)

          if [ "$PREV_TAG" = "$TAG" ] || [ -z "$PREV_TAG" ]; then
            # First tag, show all commits
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # Show commits between tags
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges "${PREV_TAG}..${TAG}")
          fi

          # Categorize commits
          FEATURES=$(echo "$CHANGELOG" | grep -i "^- feat" || true)
          FIXES=$(echo "$CHANGELOG" | grep -i "^- fix" || true)
          PERF=$(echo "$CHANGELOG" | grep -i "^- perf" || true)
          DOCS=$(echo "$CHANGELOG" | grep -i "^- docs" || true)
          OTHER=$(echo "$CHANGELOG" | grep -ivE "^- (feat|fix|perf|docs)" || true)

          # Build release body
          BODY="## 🚀 GriddyCode ${TAG}\n\n"
          BODY+="### 🍎 macOS 支持\n"
          BODY+="本版本新增完整的 macOS 支持，下载下方 .dmg 文件拖入 Applications 即可使用。\n\n"
          BODY+="**系统要求：** macOS 11.0+ (Big Sur 及以上) | Apple Silicon (M1/M2/M3/M4) 原生支持\n\n"

          if [ -n "$FEATURES" ]; then
            BODY+="### ✨ 新功能\n${FEATURES}\n\n"
          fi
          if [ -n "$FIXES" ]; then
            BODY+="### 🐛 修复\n${FIXES}\n\n"
          fi
          if [ -n "$PERF" ]; then
            BODY+="### ⚡ 性能优化\n${PERF}\n\n"
          fi
          if [ -n "$DOCS" ]; then
            BODY+="### 📝 文档\n${DOCS}\n\n"
          fi
          if [ -n "$OTHER" ]; then
            BODY+="### 📦 其他\n${OTHER}\n\n"
          fi

          # Write to file (handle multiline)
          echo -e "$BODY" > /tmp/changelog.md
          echo "Generated changelog for ${TAG}"

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: griddycode-macos-arm64
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/GriddyCode-macOS-arm64.dmg
          body_path: /tmp/changelog.md
          draft: false
          prerelease: false
