name: Build macOS arm64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GODOT_VERSION: "4.2.2"
  EXPORT_NAME: "Bussin GriddyCode"

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -L -o Godot.dmg "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.dmg"
          hdiutil attach Godot.dmg
          cp -R "/Volumes/Godot ${GODOT_VERSION}-stable/Godot.app" /Applications/
          hdiutil detach "/Volumes/Godot ${GODOT_VERSION}-stable"
          ln -s /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot

      - name: Download Export Templates
        run: |
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable
          unzip templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable/

      - name: Setup macOS Export Preset
        run: |
          cat >> export_presets.cfg << 'EOF'

          [preset.2]

          name="macOS"
          platform="macOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter="*.lua"
          exclude_filter=""
          export_path="Builds/macOS/Bussin GriddyCode.zip"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.2.options]

          custom_template/debug=""
          custom_template/release=""
          debug/export_console_wrapper=0
          texture_format/s3tc_bptc=true
          texture_format/etc2_astc=false
          binary_format/architecture="arm64"
          codesign/enable=false
          codesign/identity=""
          codesign/timestamp=true
          codesign/entitlements=""
          codesign/custom_options=PackedStringArray()
          notarization/enable=false
          notarization/apple_id=""
          notarization/apple_id_password=""
          notarization/team_id=""
          application/icon=""
          application/icon_interpolation=4
          application/bundle_identifier="com.bussin.griddycode"
          application/app_category=""
          application/short_version="1.0"
          application/version="1.0"
          application/copyright=""
          application/min_macos_version="15.0"
          application/export_angle=0
          ssh_remote_deploy/enabled=false
          EOF

      - name: Export macOS arm64
        run: |
          mkdir -p Builds/macOS
          godot --headless --export-release "macOS" Builds/macOS/Bussin\ GriddyCode.zip

      - name: Create DMG
        run: |
          mkdir -p dmg_source
          cd Builds/macOS
          unzip "Bussin GriddyCode.zip" -d ../../dmg_source/
          cd ../..
          hdiutil create -volname "GriddyCode" -srcfolder dmg_source -ov -format UDZO "Builds/macOS/GriddyCode-macOS-arm64.dmg"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: griddycode-macos-arm64
          path: Builds/macOS/GriddyCode-macOS-arm64.dmg

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: griddycode-macos-arm64
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/GriddyCode-macOS-arm64.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
